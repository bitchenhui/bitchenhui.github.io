<dialog id="image-viewer" class="image-viewer" aria-labelledby="image-viewer-title">
  <div class="image-viewer__toolbar">
    <p id="image-viewer-title"></p>
    <div class="image-viewer__actions">
      <a class="button" data-original-image target="_blank" rel="noopener noreferrer" aria-label="在新窗口打开原图">原图 <span aria-hidden="true">↗</span></a>
      <button type="button" class="button" data-close-image autofocus>关闭 <span aria-hidden="true">×</span></button>
    </div>
  </div>
  <div class="image-viewer__body"><img data-full-image alt=""></div>
</dialog>
