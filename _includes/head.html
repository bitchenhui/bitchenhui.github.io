<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
{% assign canonical_path = page.canonical_url | default: page.url %}
<link rel="canonical" href="{{ canonical_path | absolute_url }}">
{% if page.redirect_to %}
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
{% endif %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
<script>
  (function () {
    var theme;
    try { theme = window.localStorage.getItem("site-theme"); } catch (error) { theme = null; }
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = theme;
  }());
</script>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
