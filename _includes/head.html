<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
{% assign canonical_path = page.canonical_url | default: page.url %}
<link rel="canonical" href="{{ canonical_path | absolute_url }}">
{% if page.redirect_to %}
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
{% endif %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ canonical_path | absolute_url }}">
<meta property="og:locale" content="{{ site.lang | default: 'zh-CN' }}">
<meta name="twitter:card" content="summary">
<script>
  (function () {
    var theme;
    try { theme = window.localStorage.getItem("site-theme"); } catch (error) { theme = null; }
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = theme;
    var quality;
    try { quality = window.localStorage.getItem("site-quality"); } catch (error) { quality = null; }
    document.documentElement.dataset.quality = quality === "low" ? "low" : "high";
  }());
</script>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
{% if page.url == "/" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": {{ site.author.name | jsonify }},
    "url": {{ site.url | jsonify }},
    "jobTitle": {{ site.author.role | jsonify }},
    "description": {{ site.author.intro | jsonify }},
    {% if site.author.github and site.author.github != "" %}"sameAs": [{{ site.author.github | jsonify }}],{% endif %}
    {% if site.author.email and site.author.email != "" %}"email": "mailto:{{ site.author.email | escape }}",{% endif %}
    "knowsAbout": {{ site.skills | map: "name" | jsonify }}
  }
  </script>
{% endif %}
