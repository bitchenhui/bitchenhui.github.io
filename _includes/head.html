<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
{% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
{% assign canonical_path = page.canonical_url | default: page.url %}
<link rel="canonical" href="{{ canonical_path | absolute_url }}">
{% if page.redirect_to %}
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
{% endif %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ canonical_path | absolute_url }}">
<meta property="og:locale" content="{{ site.lang | default: 'zh-CN' }}">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
{% if page.url == "/" %}
  <script src="{{ '/assets/js/home.js' | relative_url }}" defer></script>
{% endif %}
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
{% if page.url == "/" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": {{ site.author.name | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }},
    "jobTitle": {{ site.author.role | jsonify }},
    "description": {{ site.author.intro | default: site.description | jsonify }},
    {% if site.author.github and site.author.github != "" %}"sameAs": [{{ site.author.github | jsonify }}],{% endif %}
    {% if site.author.email and site.author.email != "" %}"email": {{ site.author.email | prepend: "mailto:" | jsonify }},{% endif %}
    "knowsAbout": {{ site.skills | map: "name" | jsonify }}
  }
  </script>
{% endif %}
