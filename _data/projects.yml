#   period          —— 时间范围，如 "2024.03 – 至今"
#   highlights      —— 量化成果列表（可公开、可验证的数据最有说服力，如 "同档位码率节省 x%"）
#   cover           —— 封面图路径，图片放入 assets/img/ 后填 "/assets/img/xxx.png"
