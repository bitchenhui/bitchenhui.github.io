---
layout: default
---
<article class="section" aria-labelledby="post-title">
  <div class="shell prose">
    <header>
      <p><a href="{{ '/blog/' | relative_url }}">← 返回博客</a></p>
      <p><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y 年 %m 月 %d 日" }}</time></p>
      <h1 id="post-title" class="section-heading">{{ page.title | escape }}</h1>
      {% if page.tags and page.tags != empty %}
        <ul class="tag-list" aria-label="文章标签">
          {% for tag in page.tags %}
            <li class="tag">{{ tag | escape }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    </header>
    <div>
      {{ content }}
    </div>
  </div>
</article>
